agent_profile_id: 514715b0-9015-4585-86ba-e98b997bbd3d
enabled: false
entrypoint: python3 worker.py
keep_alive: null
model: null
name: 'Issue Triage (multi-repo): extensions, OpenHands, software-agent-sdk, automation,
  enterprise'
preset_metadata: null
prompt: null
setup_script_path: null
state: INACTIVE
tarball_source:
  type: internal
  url: null
timeout: 600
trigger:
  destination: dispatch_run
  filter: contains(['OpenHands/extensions', 'OpenHands/OpenHands', 'OpenHands/software-agent-sdk',
    'OpenHands/automation', 'OpenHands/enterprise', 'OpenHands/saas-deploy', 'OpenHands/evaluation'],
    repository.full_name) && contains(keys(@), 'issue') && !contains(keys(@), 'comment')
