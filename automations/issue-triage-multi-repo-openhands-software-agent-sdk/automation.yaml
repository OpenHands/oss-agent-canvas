enabled: true
entrypoint: python3 main.py
keep_alive: null
model: null
name: 'Issue Triage (multi-repo): OpenHands, software-agent-sdk'
preset_metadata: null
prompt: null
setup_script_path: null
tarball_source:
  type: internal
  url: null
timeout: 600
trigger:
  destination: dispatch_run
  filter: contains(['OpenHands/OpenHands','OpenHands/software-agent-sdk'], repository.full_name)
    && contains(keys(@), 'issue') && !contains(keys(@), 'comment') && contains(['opened','reopened','unlabeled'],
    action)
  'on': '*'
  source: github-events
  subject_key_expr: null
  type: event
