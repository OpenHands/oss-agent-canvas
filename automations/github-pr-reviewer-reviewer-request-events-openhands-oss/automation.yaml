agent_profile_id: 697a379b-babc-40bc-909d-89e318c14d41
enabled: false
entrypoint: python3 worker.py
keep_alive: null
model: null
name: 'GitHub PR Reviewer (reviewer-request events): OpenHands OSS'
observability_associations:
  github.action: action
  github.head_sha: pull_request.head.sha
  github.pr_number: pull_request.number
  github.pr_url: pull_request.html_url
  github.repository: repository.full_name
  github.sender: sender.login
preset_metadata: null
prompt: null
setup_script_path: null
state: INACTIVE
tarball_source:
  type: internal
  url: null
timeout: 1200
trigger:
  destination: dispatch_run
  filter: contains(['OpenHands/OpenHands', 'OpenHands/software-agent-sdk', 'OpenHands/automation',
    'OpenHands/extensions'], repository.full_name) && contains(keys(@), 'pull_request')
    && ((action == 'review_requested' && requested_reviewer.login == 'all-hands-bot')
    || (action == 'submitted' && contains(keys(@), 'review') && review.user.login
    == 'all-hands-bot'))
  'on': '*'
  source: github-events
  subject_key_expr: null
  turn_text_expr: null
  type: event
  wake_agent: true
