name: Weekly High-Impact Regression Hunt
preset_metadata: null
prompt: "You are conducting the Weekly High-Impact Regression Hunt for the OpenHands/software-agent-sdk\
  \ repository. Follow the specification below exactly and completely.\n\n## MINDSET\
  \ \u2014 READ THIS BEFORE DOING ANYTHING\n\nThis is an ADVERSARIAL regression hunt,\
  \ not a code review. Your job is to BREAK the code that recent PRs shipped, not\
  \ to admire it.\n\nTwo rules override everything else:\n\n1. **NO CONCLUSION WITHOUT\
  \ EXECUTION.** You may NOT conclude \"no bug\" or \"looks clean\" for any PR until\
  \ you have written AND RUN a concrete probe against the current main baseline for\
  \ each plausible failure mode you identified. Reading a diff and reasoning about\
  \ it is NEVER sufficient to dismiss a concern. \"The PR has good tests\" is NEVER\
  \ sufficient evidence of no bug \u2014 the entire premise of this hunt (see spec\
  \ lens #9) is that existing tests pass while behavior is silently wrong. If you\
  \ cannot run code, you cannot dismiss the concern.\n\n2. **ASSUME EACH PR HAS A\
  \ BUG UNTIL EXECUTION PROVES OTHERWISE.** For every behavior-changing PR, your default\
  \ hypothesis is that it introduced a regression. Your job is to construct the input\
  \ or sequence that exposes it, run it, and let the result \u2014 not your prose\
  \ reasoning \u2014 decide.\n\n### Forbidden conclusions\nDo NOT produce any of these\
  \ as a basis for closing a PR without an executed reproduction:\n- \"The PR is well-tested,\
  \ so there's no regression risk.\"\n- \"Looks clean.\"\n- \"This is a known trade-off\
  \ / intentional design choice.\"\n- \"The implementation follows existing patterns.\"\
  \n- \"I don't see a bug here\" (after only reading).\n\n### Required experiment\
  \ pattern\nFor each PR, after reading the diff and identifying plausible failure\
  \ modes via the risk lenses, you MUST:\na. Write a small, deterministic probe \u2014\
  \ a `python -c` script, a pytest case, or a shell sequence \u2014 that exercises\
  \ the specific failure mode. The probe must target the BEHAVIOR, not just re-assert\
  \ what the existing tests already assert.\nb. RUN it against the current main baseline\
  \ (the cloned repo at origin/main). Capture the real output.\nc. Only then decide:\
  \ if the probe shows materially incorrect, unsafe, unavailable, or misleading behavior,\
  \ treat it as a confirmed bug and follow the spec's PR policy. If the probe genuinely\
  \ passes AND you've exhausted the plausible failure modes, record the probe and\
  \ its output as evidence.\n\n### Depth over breadth\nInvestigate FEWER PRs DEEPLY\
  \ rather than all PRs shallowly. It is better to thoroughly try to break 5-8 PRs\
  \ (with executed probes for each plausible failure mode) than to read 24 PRs and\
  \ dismiss them all. If you run low on time/iterations, prioritize the PRs with the\
  \ highest-impact plausible failure modes and execute probes for those.\n\n## WORKFLOW\n\
  \n1. Determine the date of the prior weekly audit (use the KV store to track the\
  \ last-run timestamp; if none exists, default to 7 days ago).\n2. Use the GitHub\
  \ API (gh CLI with the GITHUB_TOKEN secret) to list every behavior-changing PR merged\
  \ into main since the prior audit. Consider a PR behavior-changing if it touches\
  \ production code (not just tests/docs/CI).\n3. For each such PR, follow the Required\
  \ investigation method in the spec: read the PR description, production diff, test\
  \ diff, and nearby callers; apply every relevant risk lens (sections 1-10); identify\
  \ the highest-impact plausible failure mode; WRITE AND RUN a deterministic reproduction\
  \ probe against the current main baseline. Do NOT skip the execution step.\n4. Treat\
  \ something as a bug only if it is materially incorrect, unsafe, unavailable, or\
  \ misleading \u2014 as shown by an EXECUTED probe, not by reasoning alone.\n5. For\
  \ each CONFIRMED bug: write a regression test that fails on unmodified main, implement\
  \ the narrowest production fix, verify the test fails on main and passes with the\
  \ fix (both RUN, not assumed), and open one PR per bug using the repository's PR\
  \ template (.github/PULL_REQUEST_TEMPLATE.md) without altering its structure. Complete\
  \ all AGENT template fields including Why, Summary, Issue Number when applicable,\
  \ How to Test, Video/Screenshots, Type, and Notes, with the additional required\
  \ contents listed in the spec's Pull request policy. Keep the HUMAN section untouched.\
  \ Do not open speculative, coverage-only, test-only, or broad-refactor PRs. When\
  \ opening a PR, you MUST request review from (a) the author of the original source\
  \ PR that introduced the bug, and (b) the person who approved that original PR.\
  \ Look up both via the GitHub API (the PR author is on the PR object; the approver\
  \ is found via the PR's reviews filtered to state=APPROVED). Add them as reviewers\
  \ on the new PR using `gh pr edit <pr> --reviewer <user>` or the REST API. If either\
  \ person is unavailable (e.g. is a bot, has left the org, or GitHub rejects the\
  \ reviewer request), note it in the PR description and continue.\n6. If no bug is\
  \ confirmed AFTER executing probes for the PRs you investigated, publish an audit\
  \ note (as a file in the workspace) listing reviewed PRs, applicable lenses, the\
  \ PROBES YOU RAN and their OUTPUT, and unconfirmed leads. The audit note must contain\
  \ evidence of execution, not just reasoning. The correct weekly outcome can be no\
  \ PRs opened \u2014 but only after genuine experimentation.\n7. After completing\
  \ the run, update the KV store with this run's timestamp so the next run picks up\
  \ from here.\n\nAll exemplar links in the spec are pinned to the reviewed baseline\
  \ commit 64042bce9f620caac920f8399170488b35e67b74; use their test structure as a\
  \ model but do not assume their subject area is the only place a pattern applies.\n\
  \n=== FULL SPECIFICATION (WEEKLY_REGRESSION_HUNT.md) ===\n\n# Weekly High-Impact\
  \ Regression Hunt\n\nConduct a weekly regression hunt for `OpenHands/software-agent-sdk`.\
  \ The goal is\nto find confirmed, high-impact bugs introduced by recent behavior-changing\
  \ PRs;\nit is not to increase a coverage percentage.\n\nReview every behavior-changing\
  \ PR merged since the prior weekly audit. For each\none, read its intent, production\
  \ diff, tests, and adjacent callers. Record every\napplicable risk lens below, including\
  \ when no bug is found.\n\nAll exemplar links are pinned to the reviewed baseline\
  \ commit\n[`64042bce9f620caac920f8399170488b35e67b74`](https://github.com/OpenHands/software-agent-sdk/tree/64042bce9f620caac920f8399170488b35e67b74),\n\
  not to a moving branch. Use their test structure as a model; do not assume their\n\
  subject area is the only place the pattern applies.\n\n## 1. Boundary contracts\
  \ and alternate valid inputs\n\n**Risk.** Structured-data code often works for a\
  \ single fixture but fails on\nvalid edge representations: empty values, `null`,\
  \ booleans, unknown fields,\nnested objects, Unicode, or JSON-mode serialization.\n\
  \n**Check.** Identify the public contract, enumerate alternate valid forms, and\n\
  compare Python-object, API-JSON, and persisted-JSON behavior.\n\n**Exemplar.** [Hook\
  \ configuration JSON round trip](https://github.com/OpenHands/software-agent-sdk/blob/64042bce9f620caac920f8399170488b35e67b74/tests/sdk/hooks/test_config.py#L289)\n\
  serializes using the real wire format and reloads it rather than only checking\n\
  in-memory construction.\n\n## 2. Stateful transitions and multi-step sequences\n\
  \n**Risk.** Isolated methods may work while a valid sequence leaves stale, lost,\n\
  or contradictory state.\n\n**Check.** Exercise sequences such as create -> use ->\
  \ switch -> use, or\nnavigate/fork/resume/retry. Check which cache, derived field,\
  \ or ownership state\nmust be invalidated or recomputed.\n\n**Exemplar.** [Navigate\
  \ to an empty tree and then emit](https://github.com/OpenHands/software-agent-sdk/blob/64042bce9f620caac920f8399170488b35e67b74/tests/sdk/conversation/local/test_conversation_tree.py#L171)\n\
  asserts the resulting event-tree semantics, not merely that both calls returned.\n\
  \n## 3. Persistence, migrations, and backward compatibility\n\n**Risk.** New objects\
  \ may work while old settings, old logs, or restart behavior\nbreak after a schema\
  \ or lifecycle change.\n\n**Check.** Test old payload -> current load -> current\
  \ save -> current reload.\nInclude omitted fields, aliases, old versions, and lifecycle\
  \ artifacts.\n\n**Exemplar.** [Legacy resume with a non-tree artifact tail](https://github.com/OpenHands/software-agent-sdk/blob/64042bce9f620caac920f8399170488b35e67b74/tests/sdk/conversation/local/test_conversation_tree.py#L346)\n\
  combines old persisted data with new runtime behavior and proves history remains\n\
  visible.\n\n## 4. Multiple construction and configuration paths\n\n**Risk.** A logical\
  \ object can be built through SDK code, API requests, profiles,\nplugins, environment\
  \ configuration, or persisted storage; defaults and\nvalidation can diverge.\n\n\
  **Check.** Compare each supported entry point, especially omitted versus `null`,\n\
  empty, and explicit values. Confirm that validation, defaults, authorization,\n\
  and visible tools agree.\n\n**Exemplar.** [Profile launch adds the browser when\
  \ usable](https://github.com/OpenHands/software-agent-sdk/blob/64042bce9f620caac920f8399170488b35e67b74/tests/agent_server/test_agent_profile_conv_start.py#L292)\n\
  and its [unusable-browser counterpart](https://github.com/OpenHands/software-agent-sdk/blob/64042bce9f620caac920f8399170488b35e67b74/tests/agent_server/test_agent_profile_conv_start.py#L327)\n\
  test the resolved launch result through the agent-server path.\n\n## 5. Failure,\
  \ retry, reconnect, and cancellation recovery\n\n**Risk.** A transient or partial\
  \ failure can leave a client, cache, or\nconversation unusable even if the normal\
  \ call succeeds.\n\n**Check.** Fail before, during, and after partial success. Verify\
  \ retry policy,\npost-recovery usability, and absence of duplicate or missing state.\n\
  \n**Exemplar.** [Retry after a retryable WebSocket close](https://github.com/OpenHands/software-agent-sdk/blob/64042bce9f620caac920f8399170488b35e67b74/tests/sdk/conversation/remote/test_websocket_client.py#L250)\n\
  models the failure and verifies retry and restored subscription behavior.\n\n##\
  \ 6. Concurrency, locks, caches, and background work\n\n**Risk.** Single-threaded\
  \ tests miss deadlocks, double cleanup, stale cached\nstate, lost updates, and blocked\
  \ event loops.\n\n**Check.** Hold an operation at a deterministic point, then issue\
  \ competing\ncalls, cancellation, and cleanup. Assert liveness, exactly-once cleanup,\
  \ lock\nrelease, and a consistent final state.\n\n**Exemplar.** [Concurrent close\
  \ serializes shared cleanup](https://github.com/OpenHands/software-agent-sdk/blob/64042bce9f620caac920f8399170488b35e67b74/tests/tools/browser_use/test_browser_cleanup.py#L139)\n\
  drives competing cleanup calls and checks synchronization rather than timing.\n\n\
  ## 7. External-system and platform variance\n\n**Risk.** Mocks hide behavior specific\
  \ to shells, filesystems, Git, browsers,\nMCP servers, and providers. OS and protocol\
  \ assumptions are especially fragile.\n\n**Check.** Identify the external behavior\
  \ the unit mock does not model. Add a\nsmall protocol-contract or real integration\
  \ test when the variance matters.\n\n**Exemplar.** [PowerShell multiline submission](https://github.com/OpenHands/software-agent-sdk/blob/64042bce9f620caac920f8399170488b35e67b74/tests/tools/terminal/test_windows_terminal_send_keys.py#L68)\n\
  captures the interactive protocol's blank-line requirement directly.\n\n## 8. Credentials,\
  \ redaction, and sensitive persistence boundaries\n\n**Risk.** Credentials move\
  \ through environment parsing, validation, encrypted\nstorage, logs, API responses,\
  \ retries, and restart; a functional path can still\nleak secrets or fail to reload.\n\
  \n**Check.** Test create/update/save/reload/error paths. Assert both that values\n\
  remain usable where required and that they are absent from logs, errors,\ntelemetry,\
  \ and responses.\n\n**Exemplar.** [Startup logging includes environment keys but\
  \ not values](https://github.com/OpenHands/software-agent-sdk/blob/64042bce9f620caac920f8399170488b35e67b74/tests/workspace/test_api_remote_workspace.py#L246)\n\
  checks the observable output rather than just a logging call.\n\n## 9. Semantic\
  \ assertions\n\n**Risk.** A status-code, object-existence, or no-exception assertion\
  \ can pass\nwhile a feature silently does the wrong thing.\n\n**Check.** State the\
  \ externally meaningful invariant: provenance, chosen model,\nactive branch, visible\
  \ tools, or persisted value. Ask whether the existing test\nwould pass if the result\
  \ were silently wrong.\n\n**Exemplar.** [Active view contains only the active branch](https://github.com/OpenHands/software-agent-sdk/blob/64042bce9f620caac920f8399170488b35e67b74/tests/sdk/conversation/local/test_conversation_tree.py#L108)\n\
  asserts the user-visible meaning of the tree.\n\n## 10. Negative-space and silent-success\
  \ cases\n\n**Risk.** The most damaging defects can return success with subtly incorrect\n\
  output. Invalid, malformed, empty, ambiguous, or unsupported input needs a\ndeliberate\
  \ behavior.\n\n**Check.** Ask what could silently be wrong while still returning\
  \ success. Test\nmalformed, empty, Unicode, duplicate, ambiguous, and unsupported\
  \ cases.\n\n**Exemplar.** [Malformed shell input does not crash parsing](https://github.com/OpenHands/software-agent-sdk/blob/64042bce9f620caac920f8399170488b35e67b74/tests/sdk/security/test_shell_parser.py#L48)\n\
  makes the safe behavior for malformed input explicit.\n\n## Required investigation\
  \ method\n\n1. Read the PR description, production diff, test diff, and nearby callers.\n\
  2. Apply every relevant risk lens above.\n3. Identify the highest-impact plausible\
  \ failure mode.\n4. Attempt a deterministic reproduction against the current `main`\
  \ baseline.\n5. Treat it as a bug only if it is materially incorrect, unsafe, unavailable,\n\
  \   or misleading.\n6. Write a regression test first; it must fail on unmodified\
  \ `main`.\n7. Implement the narrowest production fix.\n8. Verify that the regression\
  \ test fails on unmodified `main`, passes with the\n   fix, relevant neighboring\
  \ tests pass, and the assertion proves a user-visible\n   or safety-critical invariant.\n\
  \n## Pull request policy\n\nOpen a PR only for a confirmed bug. Keep one independently\
  \ reviewable bug per\nPR. Do not open speculative, coverage-only, test-only, or\
  \ broad-refactor PRs.\n\nThe PR must use the repository's [PR template](https://github.com/OpenHands/software-agent-sdk/blob/64042bce9f620caac920f8399170488b35e67b74/.github/PULL_REQUEST_TEMPLATE.md)\n\
  without changing its structure. Keep the `HUMAN` section untouched. Complete all\n\
  of the `AGENT` template fields, including `Why`, `Summary`, `Issue Number` when\n\
  applicable, `How to Test`, `Video/Screenshots`, `Type`, and `Notes`.\n\nIn `Why`\
  \ and `How to Test`, additionally include:\n\n- the source PR(s) reviewed;\n- the\
  \ applicable risk lens or lenses;\n- the deterministic reproduction and impact;\n\
  - root cause;\n- proof that the regression test fails on unmodified `main`;\n- before/after\
  \ test commands and results;\n- an end-to-end validation or reproduction, as required\
  \ by the template;\n- why the original tests did not catch the case.\n\nIf no bug\
  \ is confirmed, publish an audit note with reviewed PRs, applicable\nlenses, reproduction\
  \ attempts, and unconfirmed leads. The correct weekly\noutcome can be **no PRs opened**;\
  \ the standard is confirmed impact, not activity.\n"
