  \ confirm with web/docs.\n\n#### Tier 1 \u2014 LiteLLM model registry (PRIMARY,\
  \ programmatic)\n\nThe SDK already depends on LiteLLM (`litellm>=1.93.0`) and its\
  \ own `unverified_models.py` already calls `litellm.model_list + list(litellm.model_cost.keys())`\
  \ to compute the set of all known models, then subtracts `VERIFIED_MODELS` to find\
  \ unverified ones. LiteLLM tracks new model releases across all providers and is\
  \ updated frequently. This is the most reliable, deterministic source for detecting\
  \ models we don't yet have in `verified_models.py`.\n\n**The repo already has a\
  \ function that does most of this work.** After installing the SDK's dependencies\
  \ (`pip install -e openhands-sdk/` or `pip install litellm`), you can import and\
  \ call `get_unverified_models()` from `openhands.sdk.llm.utils.unverified_models`\
  \ \u2014 it returns a `dict[provider, list[model_id]]` of everything LiteLLM knows\
  \ about that is NOT yet in `VERIFIED_MODELS`. This is the fastest way to get the\
  \ candidate list. However, it returns ALL unverified models (including ones we deliberately\
  \ exclude), so you must still filter to the series we support (see the filter patterns\
  \ below).\n\n**Important \u2014 upgrade LiteLLM first.** The SDK's `pyproject.toml`\
  \ pins `litellm>=1.93.0`, but LiteLLM releases new model entries frequently. Run\
  \ `pip install --upgrade litellm` to get the latest model registry before running\
  \ detection \u2014 this ensures you see models added since the SDK's lockfile was\
  \ last updated. The automation's job is precisely to catch what the pinned version\
  \ might be missing.\n\nAlternatively, run this standalone detection script (install\
  \ litellm first: `pip install --upgrade litellm`):\n\n```python\nimport litellm,\
  \ re, json\n\n# Our verified_models.py providers and how they map to LiteLLM model\
  \ IDs.\n# The \"bare\" providers (openai, anthropic) use unprefixed model IDs in\n\
  # verified_models.py (e.g. \"gpt-5.6\", \"claude-opus-5\"). The \"prefixed\"\n#\
  \ providers use LiteLLM's \"provider/model\" form, and verified_models.py\n# stores\
  \ the model part without the prefix (e.g. \"deepseek-chat\" from\n# \"deepseek/deepseek-chat\"\
  ).\nPROVIDER_LITELLM_MAP = {\n    \"openai\": {\n        \"mode\": \"bare\",\n \
  \       \"prefixes\": [],  # bare names in model_cost (no provider/ prefix)\n  \
  \      \"patterns\": [r\"^gpt-5\", r\"^gpt-4\", r\"^o[134]-\", r\"^o[134]$\", r\"\
  ^codex-\"],\n    },\n    \"anthropic\": {\n        \"mode\": \"bare\",\n       \
  \ \"prefixes\": [],\n        \"patterns\": [r\"^claude-\"],\n    },\n    \"gemini\"\
  : {\n        \"mode\": \"prefixed\",\n        \"prefixes\": [\"gemini/\"],\n   \
  \     \"filter_patterns\": [r\"gemini-3\"],  # only gemini-3.x series we support\n\
  \    },\n    \"deepseek\": {\n        \"mode\": \"prefixed\",\n        \"prefixes\"\
  : [\"deepseek/\"],\n        \"filter_patterns\": [r\"deepseek-chat\", r\"deepseek-v[34]\"\
  , r\"deepseek-reasoner\"],\n    },\n    \"mistral\": {\n        \"mode\": \"prefixed\"\
  ,\n        \"prefixes\": [\"mistral/\"],\n        \"filter_patterns\": [r\"devstral\"\
  ],\n    },\n    \"moonshot\": {\n        \"mode\": \"prefixed\",\n        \"prefixes\"\
  : [\"moonshot/\"],\n        \"filter_patterns\": [r\"kimi-k\"],\n    },\n    \"\
  minimax\": {\n        \"mode\": \"prefixed\",\n        \"prefixes\": [\"minimax/\"\
  ],\n        \"filter_patterns\": [r\"minimax-m\", r\"MiniMax-M\"],\n    },\n   \
  \ \"glm\": {\n        \"mode\": \"prefixed\",\n        \"prefixes\": [\"fireworks_ai/glm-\"\
  , \"dashscope/glm-\", \"novita/zai-org/glm-\"],\n        # Also bare names like\
  \ \"glm-4-7-251222\"\n        \"bare_patterns\": [r\"^glm-[45]\"],\n        \"strip_prefix\"\
  : True,  # extract just \"glm-X.Y\" from the LiteLLM key\n    },\n    \"nvidia\"\
  : {\n        \"mode\": \"prefixed\",\n        \"prefixes\": [\"nvidia.nemotron-\"\
  , \"deepinfra/nvidia/Nemotron-\"],\n        \"filter_patterns\": [r\"nemotron-3\"\
  ],\n        \"bare_patterns\": [r\"^nemotron-3\"],\n    },\n    \"qwen\": {\n  \
  \      \"mode\": \"prefixed\",\n        \"prefixes\": [\"dashscope/qwen\", \"bedrock/\"\
  ],\n        \"filter_patterns\": [r\"qwen3-coder\", r\"qwen3-6\", r\"qwen3\\.6\"\
  ],\n    },\n}\n\n# Combine litellm.model_list and model_cost keys into one set\n\
  all_litellm_models = set(litellm.model_list) | set(litellm.model_cost.keys())\n\n\
  # Parse current verified_models.py to get the existing model IDs per provider\n\
  # (Read the file and extract the arrays, or import it if the repo is on path)\n\
  # ... read verified_models.py and build current_models: dict[str, set[str]]\n\n\
  for provider, spec in PROVIDER_LITELLM_MAP.items():\n    litellm_models = set()\n\
  \    if spec[\"mode\"] == \"bare\":\n        # Match bare names in model_cost (no\
  \ \"/\" prefix)\n        for m in all_litellm_models:\n            if \"/\" not\
  \ in m:\n                for pat in spec[\"patterns\"]:\n                    if\
  \ re.match(pat, m, re.IGNORECASE):\n                        litellm_models.add(m)\n\
  \                        break\n    else:\n        for m in all_litellm_models:\n\
  \            for prefix in spec[\"prefixes\"]:\n                if m.startswith(prefix):\n\
  \                    model_id = m[len(prefix):] if spec.get(\"strip_prefix\") else\
  \ m.split(\"/\", 1)[-1]\n                    # Apply filter patterns if specified\n\
  \                    if \"filter_patterns\" not in spec or any(\n              \
  \          re.search(p, model_id, re.IGNORECASE) for p in spec[\"filter_patterns\"\
  ]\n                    ):\n                        litellm_models.add(model_id)\n\
  \                    break\n            # Also check bare patterns for mixed providers\
  \ (glm, nvidia)\n            for pat in spec.get(\"bare_patterns\", []):\n     \
  \           if \"/\" not in m and re.match(pat, m, re.IGNORECASE):\n           \
  \         litellm_models.add(m)\n    \n    # Normalize to lowercase for comparison\n\
  \    litellm_norm = {m.lower() for m in litellm_models}\n    current_norm = {m.lower()\
  \ for m in current_models.get(provider, set())}\n    \n    new_models = litellm_norm\
  \ - current_norm\n    if new_models:\n        print(f\"\\n=== {provider}: NEW models\
  \ in LiteLLM not in verified_models.py ===\")\n        for m in sorted(new_models):\n\
  \            print(f\"  {m}\")\n```\n\nThis script outputs the exact set of model\
  \ IDs that LiteLLM knows about for each provider but that are missing from our `verified_models.py`.\
  \ This is the candidate list.\n\n#### Tier 2 \u2014 Provider API model-list endpoints\
  \ (SECONDARY)\n\nSome providers expose OpenAI-compatible `/v1/models` endpoints\
  \ that list currently available models. Query these to catch models that may not\
  \ yet be in LiteLLM. These require API keys stored as secrets \u2014 if a key is\
  \ not available, skip that provider's API check and rely on Tier 1.\n\n| Provider\
  \ | Endpoint | Auth | Secret needed |\n|---|---|---|---|\n| OpenAI | `GET https://api.openai.com/v1/models`\
  \ | `Authorization: Bearer <key>` | `OPENAI_API_KEY` (if registered) |\n| Anthropic\
  \ | `GET https://api.anthropic.com/v1/models` | `x-api-key: <key>` + `anthropic-version:\
  \ 2023-06-01` | `ANTHROPIC_API_KEY` (if registered) |\n| DeepSeek | `GET https://api.deepseek.com/models`\
  \ | `Authorization: Bearer <key>` | `DEEPSEEK_API_KEY` (if registered) |\n| Mistral\
  \ | `GET https://api.mistral.ai/v1/models` | `Authorization: Bearer <key>` | `MISTRAL_API_KEY`\
  \ (if registered) |\n| Moonshot | `GET https://api.moonshot.cn/v1/models` | `Authorization:\
  \ Bearer <key>` | `MOONSHOT_API_KEY` (if registered) |\n| Google Gemini | `GET https://generativelanguage.googleapis.com/v1beta/models?key=<key>`\
  \ | URL param | `GEMINI_API_KEY` (if registered) |\n| MiniMax | `GET https://api.minimaxi.com/v1/models`\
  \ | `Authorization: Bearer <key>` | `MINIMAX_API_KEY` (if registered) |\n| Zhipu\
  \ (GLM) | `GET https://api.z.ai/api/paas/v4/models` | `Authorization: Bearer <key>`\
  \ | `ZAI_API_KEY` (if registered) |\n| Nvidia | `GET https://integrate.api.nvidia.com/v1/models`\
  \ | None (public) | None \u2014 always query this |\n\nFor each provider with an\
  \ available key, fetch the model list, extract the model IDs, and compare against\
  \ both `verified_models.py` AND the LiteLLM candidate list from Tier 1. Any model\
  \ in the API list that is NOT in `verified_models.py` is an additional candidate.\n\
  \n**Important:** Not all registered secrets may be available. Use `get_secret(name)`\
  \ (the agent-server secret fetch helper) to check. If a secret is not set, skip\
  \ that provider's API check gracefully.\n\n#### Tier 3 \u2014 Web confirmation (TERTIARY,\
  \ for ID verification only \u2014 use sparingly)\n\nOnly use web browsing to confirm\
  \ IDs for models from Tier 1/2 where the exact ID format is uncertain (e.g., a provider\
  \ where LiteLLM and our `verified_models.py` might use different casing or naming\
  \ conventions). **Do NOT browse every provider's docs on every run** \u2014 this\
  \ is expensive and slow. If a model ID came from LiteLLM's `model_cost` registry\
  \ (which tracks exact API IDs), trust it and skip web verification. Only browse\
  \ docs when you have a genuine ambiguity about the exact ID string.\n\nOfficial\
  \ docs URLs when needed:\n\n| Provider | Official model docs URL |\n|---|---|\n\
  | OpenAI | https://platform.openai.com/docs/models |\n| Anthropic | https://docs.anthropic.com/en/docs/about-claude/models/overview\
  \ |\n| Google Gemini | https://ai.google.dev/gemini-api/docs/models |\n| DeepSeek\
  \ | https://api-docs.deepseek.com/quick_start/pricing |\n| Mistral | https://docs.mistral.ai/getting-started/models/models_overview/\
  \ |\n| Moonshot | https://platform.moonshot.ai/docs/intro |\n| MiniMax | https://platform.minimaxi.com/document/Models\
  \ |\n| Zhipu (GLM) | https://docs.z.ai/ui/models |\n| Nvidia | https://build.nvidia.com/models\
  \ |\n| Alibaba (Qwen) | https://help.aliyun.com/zh/model-studio/getting-started/models\
  \ |\n\nOnly flag models that belong to a **series we already support**. Do not propose\
  \ adding entirely new providers \u2014 that is a product decision for humans. Focus\
  \ on incremental additions to existing series (e.g., a new `gpt-5.7`, a new `claude-opus-4-9`,\
  \ a new `gemini-3.2-pro`).\n\nFor each candidate new model, confirm the **exact\
  \ model ID string** as it would appear in API calls (the format used in `verified_models.py`\
  \ \u2014 typically lowercase, version-dotted, date-suffixed where the provider uses\
  \ dates). If you cannot confirm the exact ID from an official source, do NOT add\
  \ it \u2014 an incorrect ID is worse than a missing one.\n\n### Step 3 \u2014 Open\
  \ or update PRs\n\nIf you found one or more confirmed new models:\n\n1. **Check\
  \ for an existing open PR first.** Use the GitHub API to search for open PRs in\
  \ `OpenHands/software-agent-sdk` created by `all-hands-bot` with \"LLM\" or \"model\"\
  \ in the title:\n   ```bash\n   curl -s -H \"Authorization: token $GITHUB_TOKEN\"\
  \ \\\n     \"https://api.github.com/repos/OpenHands/software-agent-sdk/pulls?state=open&sort=created&direction=desc&per_page=20\"\
  \ \\\n     | python3 -c \"\n   import json, sys\n   prs = json.load(sys.stdin)\n\
  \   for pr in prs:\n       if pr['user']['login'] == 'all-hands-bot' and ('llm'\
  \ in pr['title'].lower() or 'model' in pr['title'].lower()):\n           print(pr['number'],\
  \ pr['title'], pr['head']['ref'])\n   \"\n   ```\n   - If an existing open PR is\
  \ found: **check out its branch** (`git fetch origin <branch> && git checkout <branch>`),\
  \ apply the new model additions on top of it, and force-push the updated commit.\
  \ Do NOT open a new PR. This keeps the review history in one place and avoids PR\
  \ sprawl.\n   - If no existing open PR is found: create a new branch `add-new-llm-models-<YYYYMMDD>`.\n\
  2. Update `verified_models.py`: add each new model ID to the correct provider array\
  \ AND to `VERIFIED_OPENHANDS_MODELS` if it belongs to the curated subset (i.e.,\
  \ it is a flagship/reasoning model from a provider we surface to users \u2014 follow\
  \ the existing pattern in that list). Keep arrays sorted consistently with the existing\
  \ ordering (newest/highest first, matching the current convention).\n3. If a new\
  \ model is also accepted by an ACP CLI (verify against the ACP provider's documented\
  \ model list), update the corresponding `_*_MODELS` tuple in `acp_providers.py`\
  \ with an `ACPModelOption(id=..., label=\"Human-Readable Name\")`.\n4. Commit with\
  \ message: `Add newly released LLM models to verified lists` (or `Update LLM model\
  \ list with new models` if appending to an existing PR branch).\n5. Push the branch\
  \ and open a PR (if new) using the repository's PR template (`.github/PULL_REQUEST_TEMPLATE.md`)\
  \ if one exists. Complete all AGENT template fields. The PR body must list each\
  \ new model, its provider, the official source URL confirming the model ID, and\
  \ which arrays were updated. Keep the HUMAN section untouched. If updating an existing\
  \ PR, add a comment to the PR summarizing what was added in this update.\n6. Use\
  \ `git config user.name \"openhands\"` and `git config user.email \"openhands@all-hands.dev\"\
  ` if not already set. Add `Co-authored-by: openhands <openhands@all-hands.dev>`\
  \ to the commit message.\n7. Do NOT mark the PR as ready for review unless explicitly\
  \ asked.\n\n### Step 4 \u2014 Post to Slack\n\nPost a message to Slack channel `C06R25BT5B2`\
  \ (`#proj-agent`) in the **OpenHands** Slack workspace, authenticating with the\
  \ `SLACK_BOT_TOKEN_OPENHANDS_AI` secret.\n\n- **Only post if changes were made**\
  \ (either a new PR was opened or an existing PR was updated with new models). Do\
  \ NOT post if no new models were found \u2014 silent no-op runs avoid noise in the\
  \ channel.\n\n- If a new PR was opened, post a concise message listing the PR link\
  \ and a one-line summary of the models added. Example:\n\n  ```\n  \U0001F916 LLM\
  \ model list update \u2014 <date>\n\n  New models detected, PR opened:\n  \u2022\
  \ <PR URL> \u2014 Added gpt-5.7, gpt-5.7-mini (OpenAI), claude-opus-4-9 (Anthropic)\n\
  \n  _Generated by OpenHands AI on behalf of the user._\n  ```\n\n- If an existing\
  \ open PR was updated with additional models, post a concise message referencing\
  \ the existing PR and noting what was added. Example:\n\n  ```\n  \U0001F916 LLM\
  \ model list update \u2014 <date>\n\n  Updated existing PR with newly detected models:\n\
  \  \u2022 <PR URL> \u2014 Added kimi-k2.7-code (Moonshot), gemini-3.6-flash (Google)\n\
  \n  _Generated by OpenHands AI on behalf of the user._\n  ```\n\n- Use `curl` to\
  \ post to `https://slack.com/api/chat.postMessage` with header `Authorization: Bearer\
  \ $SLACK_BOT_TOKEN_OPENHANDS_AI` and JSON body `{\"channel\": \"C06R25BT5B2\", \"\
  text\": \"<message>\"}`.\n\n### Step 5 \u2014 Summary\n\nWrite a brief summary file\
  \ in the workspace (`/workspace/summary.md`) recording: providers checked, models\
  \ found (if any), PR URLs, and the Slack message posted. This is for auditability.\n\
  \n## Guardrails\n\n- Only add models whose exact API ID you have **confirmed from\
  \ an official source** (provider docs, official blog, or API model list). Never\
  \ guess an ID.\n- Only add models in **series we already support**. No new providers.\n\
  - Do not remove or rename existing model IDs \u2014 only append.\n- If the official\
  \ source is ambiguous about the exact ID string, skip that model and note it in\
  \ the summary.\n- **Never open a new PR if an existing open PR from `all-hands-bot`\
  \ for LLM/model updates already exists.** Instead, check out that PR's branch, add\
  \ the new models, and force-push. One rolling PR at a time.\n- **Only post to Slack\
  \ when changes are actually made** (new PR opened or existing PR updated). No-post\
  \ on no-op runs.\n- One PR per run is preferred (batch all new models into a single\
  \ PR or the existing rolling PR).\n- Keep the Slack message concise.\n- Always include\
  \ the AI disclosure line in the Slack message.\n"
