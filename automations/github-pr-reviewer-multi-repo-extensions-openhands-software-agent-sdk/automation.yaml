enabled: true
entrypoint: python3 main.py
keep_alive: null
model: deepseek-v4
name: 'GitHub PR Reviewer (multi-repo): extensions, OpenHands, software-agent-sdk,
  automation, enterprise'
preset_metadata: null
prompt: null
setup_script_path: null
tarball_source:
  type: internal
  url: null
timeout: 1800
trigger:
  destination: dispatch_run
  filter: contains(['OpenHands/extensions', 'OpenHands/OpenHands', 'OpenHands/software-agent-sdk',
    'OpenHands/automation'], repository.full_name) && contains(keys(@), 'pull_request')
    && !contains(keys(@), 'comment') && !contains(keys(@), 'review') && contains(['opened','reopened','synchronize','ready_for_review','review_requested'],
    action)
  'on': '*'
  source: github-events
  subject_key_expr: null
  turn_text_expr: null
  type: event
