agent_profile_id: null
enabled: false
entrypoint: .venv/bin/python main.py
keep_alive: null
model: null
name: Weekly Automation & Conversation Health Review
observability_associations: null
preset_metadata: null
prompt: "You are auditing the shared OSS automation VM (`dev-oss-automation-vm`) that\
  \ hosts this automation platform: Agent Canvas, its agent-server, and every other\
  \ automation defined here. This is a **read-only** health and improvement review\
  \ \u2014 never modify, enable, disable, delete, or dispatch any automation (including\
  \ this one), and never write to `automations.db`.\n\n## Guardrails\n- Never print\
  \ or forward any secret/credential value, even partially masked. Describe that one\
  \ appeared (\"a masked OpenAI key recurs in N error events for automation X\") without\
  \ repeating it.\n- Only message Slack via the one post described in \"Report\" below.\
  \ No GitHub issues/PRs/comments.\n- If a data source is unavailable, say so rather\
  \ than guessing.\n- Base every claim on evidence you gather this run.\n\n## Data\
  \ sources\nEverything below is readable directly on this host \u2014 no sudo needed.\
  \ Use Python's `sqlite3` module (no `sqlite3` CLI binary here). Write small scripts\
  \ to aggregate rather than reading large files by hand.\n\n1. **Automations & runs**:\
  \ `/var/lib/agent-canvas/.openhands/automation/automations.db`, opened read-only\
  \ (`file:...?mode=ro`, `uri=True`). Tables: `automations` (id, name, trigger, enabled,\
  \ model, timeout, prompt, created/updated/deleted_at) and `automation_runs` (automation_id,\
  \ status, error_detail, started_at, completed_at, conversation_id).\n2. **Conversations**:\
  \ `/var/lib/agent-canvas/.openhands/agent-canvas/dev_conversations/<uuid-no-dashes>/`\
  \ \u2014 join via `automation_runs.conversation_id` (dashes removed = directory\
  \ name).\n   - `base_state.json`: `execution_status`; `stats.usage_to_metrics.default.accumulated_cost`\
  \ and `accumulated_token_usage`; `agent.agent_context.skills`, `activated_knowledge_skills`,\
  \ `invoked_skills`. Never read/repeat the encrypted `agent.llm.api_key` value.\n\
  \   - `events/event-*.json`: `\"kind\":\"ConversationErrorEvent\"` entries (`code`,\
  \ `detail`) \u2014 real failures a `COMPLETED` run status can hide.\n3. **Cross-run\
  \ memory**: KV store at `http://127.0.0.1:18001/api/automation/v1/kv/automation_health_review_state_v1`,\
  \ header `Authorization: Bearer $OPENHANDS_AUTOMATION_API_KEY` (already set \u2014\
  \ don't print it). GET first (404 = first run, empty state). At the end, PUT `{\"\
  last_reviewed_through\": \"<ISO8601>\", \"fingerprints\": [...]}`, passing back\
  \ `if_version`; on a version conflict, GET and retry once.\n\n## Window\nCover runs/conversations\
  \ since `last_reviewed_through` (default 7 days ago if no prior state). Full breakdown\
  \ for every enabled automation; one line for any deleted/disabled during the window.\n\
  \n## Four lenses\nGround every claim in a specific automation/run/conversation id.\
  \ Prefer a few high-signal findings over an exhaustive list. Nothing worth reporting\
  \ \u2192 write \"No new findings\".\n\n**Errors** \u2014 Cluster `error_detail`\
  \ (normalized) per automation; report failure rate and flag any automation running\
  \ hotter than its own baseline or peers. Split into: (a) known self-healing noise\
  \ (e.g. `<urlopen error timed out>`/`Errno 110`) \u2014 only flag if volume clearly\
  \ grew; (b) genuine bugs (tracebacks, `TypeError`-shaped messages, concurrency/lock\
  \ errors, missing-config errors) \u2014 name the automation and quote the message;\
  \ (c) silent failures \u2014 run `status=COMPLETED` but conversation `execution_status`\
  \ is `error`/`stuck` or has a `ConversationErrorEvent` \u2014 a real success/failure\
  \ blind spot. Skip anything with an unchanged fingerprint from a prior run beyond\
  \ a one-line \"still present\" mention.\n\n**Resources** \u2014 Roll up cost/tokens\
  \ per automation for the window; flag any automation or single run far outside its\
  \ own or peers' norm (runaway loop, unbounded context, checkout bloat). Check `du\
  \ -sh` on `dev_conversations/` and `workspaces/automation-runs/` (never pruned)\
  \ for disproportionate growth. Flag `timeout` values mismatched with actual run\
  \ durations.\n\n**Security** \u2014 Scan `error_detail`/events for credential-shaped\
  \ strings indicating a leak or misconfiguration, not an intentional mask \u2014\
  \ report where and why, never the string. Flag automations (especially externally-triggered\
  \ ones like `issues.opened`/Slack `app_mention`) whose granted capability exceeds\
  \ their task. Flag disabled-but-not-deleted or test-named automations still holding\
  \ live credentials. If `ps -eo cmd` shows secrets as plaintext args to `main.py`\
  \ (read-only check, don't signal anything), note it once as a standing exposure.\n\
  \n**Skills** \u2014 Tabulate `activated_knowledge_skills`/`invoked_skills` frequency;\
  \ flag over-broad/frequent activation (context bloat) and tasks that plausibly needed\
  \ a skill that never activated. Note any oversized skill content relative to task\
  \ need (ties to Resources).\n\n## Report\nPost exactly one Slack message to channel\
  \ `C0BGK8NRYUX` via `https://slack.com/api/chat.postMessage` using `$SLACK_BOT_TOKEN`:\n\
  \n`*Automation & conversation health review \u2014 <window start> to <window end>*`\n\
  \nthen Security / Resources / Errors / Skills in order, each a header line + up\
  \ to 5 one-line bullets naming the automation/run/conversation and a concrete recommendation\
  \ (\"No new findings\" if none). End with \"Sent by OpenHands on behalf of the user.\"\
  \ Single top-level message, no thread, no attachment.\n\nFinally, write the updated\
  \ KV state so next week doesn't repeat unchanged findings.\n"
setup_script_path: setup.sh
state: INACTIVE
tarball_executables:
- setup.sh
tarball_source:
  type: internal
  url: null
timeout: 1200
trigger:
  schedule: 0 0 * * 5
  timezone: UTC
  type: cron
