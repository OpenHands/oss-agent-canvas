name: LLM Model List Update
observability_associations: null
preset_metadata:
  preset_type: prompt
  prompt: "# LLM Model List Update Automation \u2014 Prompt\n\nYou are running as\
    \ an OpenHands automation, twice a week (Wednesday and Saturday at 09:00 UTC).\
    \ Your job is to detect newly released language models in the series OpenHands\
    \ already supports, open PRs updating the supported-model lists, and post the\
    \ PR links to Slack.\n\n## Context \u2014 what lists exist and where\n\nThe canonical\
    \ source of truth for supported LLM models lives in the cloned `OpenHands/software-agent-sdk`\
    \ repository at:\n\n**`openhands-sdk/openhands/sdk/llm/utils/verified_models.py`**\n\
    \nThis file contains per-provider arrays of verified model IDs:\n\n- `VERIFIED_OPENAI_MODELS`\
    \ \u2014 OpenAI GPT series (gpt-5.x, o-series, gpt-4.x)\n- `VERIFIED_ANTHROPIC_MODELS`\
    \ \u2014 Claude series (opus, sonnet, haiku)\n- `VERIFIED_MISTRAL_MODELS` \u2014\
    \ Mistral / Devstral series\n- `VERIFIED_GEMINI_MODELS` \u2014 Google Gemini series\
    \ (gemini-3.x)\n- `VERIFIED_DEEPSEEK_MODELS` \u2014 DeepSeek series (v3/v4)\n\
    - `VERIFIED_MOONSHOT_MODELS` \u2014 Moonshot Kimi series (k2/k3)\n- `VERIFIED_MINIMAX_MODELS`\
    \ \u2014 MiniMax series (m2/m3)\n- `VERIFIED_GLM_MODELS` \u2014 Zhipu GLM series\
    \ (glm-4/5)\n- `VERIFIED_NVIDIA_MODELS` \u2014 Nvidia Nemotron series\n- `VERIFIED_QWEN_MODELS`\
    \ \u2014 Alibaba Qwen series (qwen3)\n- `VERIFIED_OPENHANDS_MODELS` \u2014 the\
    \ cross-provider curated subset surfaced to OpenHands users\n\nA secondary file,\
    \ **`openhands-sdk/openhands/sdk/settings/acp_providers.py`**, holds ACP provider\
    \ model pickers (`_CLAUDE_MODELS`, `_CODEX_MODELS`, `_GEMINI_MODELS`, `_PI_MODELS`,\
    \ `_OPENCODE_MODELS`). These are tied to what each ACP CLI server exposes, so\
    \ only update them when a new model is both released AND accepted by the corresponding\
    \ ACP CLI. When in doubt, focus on `verified_models.py` \u2014 that is the list\
    \ that gets out of date and the one this automation primarily targets.\n\nThe\
    \ OpenHands frontend (`OpenHands/OpenHands`) does NOT maintain its own model list.\
    \ It sources from the typescript-client, which is a generated mirror of the SDK\
    \ Python. So updating `verified_models.py` propagates everywhere.\n\n## Credentials\n\
    \n- Use the registered `GITHUB_TOKEN` secret for all GitHub API calls, git operations,\
    \ and PR creation.\n- Use the registered `SLACK_BOT_TOKEN_OPENHANDS_AI` secret\
    \ to post to Slack. This token belongs to the **OpenHands** Slack workspace (team\
    \ ID `T06P212QSEA`, domain `openhands-ai`). Do NOT use `SLACK_BOT_TOKEN` \u2014\
    \ that token belongs to a different (All Hands AI) workspace and cannot post to\
    \ the destination below.\n- Slack destination channel: `#proj-agent`, channel\
    \ ID `C06R25BT5B2`. Post by channel ID.\n\n## Workflow\n\n### Step 1 \u2014 Read\
    \ the current state\n\n1. Read `openhands-sdk/openhands/sdk/llm/utils/verified_models.py`\
    \ from the cloned repo. Record every model ID currently listed, grouped by provider.\n\
    2. Also read `openhands-sdk/openhands/sdk/settings/acp_providers.py` to record\
    \ the current ACP model pickers.\n\n### Step 2 \u2014 Detect new model releases\n\
    \nDetection uses **LiteLLM's `model_cost` registry as the sole discovery source**,\
    \ cross-referenced against provider API endpoints when keys are available. **Do\
    \ NOT use web browsing for model discovery** \u2014 browsing provider docs led\
    \ to adding models that don't actually exist (e.g. `qwen3.8-flash`) or aren't\
    \ publicly available yet (e.g. `claude-mythos-5`). LiteLLM's `model_cost` tracks\
    \ models that have pricing entries, which is a much more reliable signal that\
    \ a model is a real, callable product.\n\n**Critical distinction: `model_cost`\
    \ vs `model_list`.** Use `litellm.model_cost` ONLY, not `litellm.model_list`.\
    \ `model_cost` contains models with pricing data (indicating they're real products).\
    \ `model_list` is broader and includes speculative/preview entries. The SDK's\
    \ own `unverified_models.py` uses both, but for this automation's purpose \u2014\
    \ adding models that users can actually call \u2014 `model_cost` is the right\
    \ filter.\n\n**Even `model_cost` can include not-yet-public models** (LiteLLM\
    \ sometimes adds pricing based on announcements before models are callable). To\
    \ handle this, cross-reference against the provider's `/v1/models` API endpoint\
    \ when an API key is available. A model that appears in BOTH `model_cost` AND\
    \ the provider's API model list is confirmed publicly available.\n\n#### Tier\
    \ 1 \u2014 LiteLLM `model_cost` registry (PRIMARY discovery source)\n\nThe SDK\
    \ already depends on LiteLLM (`litellm>=1.93.0`). LiteLLM's `model_cost` dictionary\
    \ tracks models that have pricing entries \u2014 meaning they're real, trackable\
    \ products. This is the most reliable programmatic source for detecting models\
    \ we don't yet have in `verified_models.py`.\n\n**Important \u2014 upgrade LiteLLM\
    \ first.** Run `pip install --upgrade litellm` to get the latest model registry\
    \ before running detection. The SDK's `pyproject.toml` pins `litellm>=1.93.0`\
    \ which may lag behind.\n\nRun this detection script:\n\n```python\nimport litellm,\
    \ re, json\n\n# Use model_cost ONLY (models with pricing = real products), NOT\
    \ model_list\nall_litellm_models = set(litellm.model_cost.keys())\n\n# Our verified_models.py\
    \ providers and how they map to LiteLLM model IDs.\n# The \"bare\" providers (openai,\
    \ anthropic) use unprefixed model IDs in\n# verified_models.py. The \"prefixed\"\
    \ providers use LiteLLM's \"provider/model\"\n# form, and verified_models.py stores\
    \ the model part without the prefix.\n# Matching is CASE-INSENSITIVE because LiteLLM\
    \ uses varied casing\n# (e.g. \"GLM-5.3\" vs \"glm-5.3\", \"Nemotron-3-Ultra\"\
    \ vs \"nemotron-3-ultra\").\nPROVIDER_LITELLM_MAP = {\n    \"openai\": {\n   \
    \     \"mode\": \"bare\",\n        \"patterns\": [r\"^gpt-5\", r\"^gpt-4\", r\"\
    ^o[134]-\", r\"^o[134]$\", r\"^codex-\"],\n    },\n    \"anthropic\": {\n    \
    \    \"mode\": \"bare\",\n        \"patterns\": [r\"^claude-\"],\n    },\n   \
    \ \"gemini\": {\n        \"mode\": \"prefixed\",\n        \"prefixes\": [\"gemini/\"\
    ],\n        \"filter_patterns\": [r\"gemini-3\"],\n    },\n    \"deepseek\": {\n\
    \        \"mode\": \"prefixed\",\n        \"prefixes\": [\"deepseek/\"],\n   \
    \     \"filter_patterns\": [r\"deepseek-chat\", r\"deepseek-v[34]\", r\"deepseek-reasoner\"\
    ],\n    },\n    \"mistral\": {\n        \"mode\": \"prefixed\",\n        \"prefixes\"\
    : [\"mistral/\"],\n        \"filter_patterns\": [r\"devstral\"],\n    },\n   \
    \ \"moonshot\": {\n        \"mode\": \"prefixed\",\n        \"prefixes\": [\"\
    moonshot/\"],\n        \"filter_patterns\": [r\"kimi-k\"],\n    },\n    \"minimax\"\
    : {\n        \"mode\": \"prefixed\",\n        \"prefixes\": [\"minimax/\"],\n\
    \        \"filter_patterns\": [r\"minimax-m\", r\"MiniMax-M\"],\n    },\n    \"\
    glm\": {\n        \"mode\": \"prefixed\",\n        # GLM appears under many provider\
    \ prefixes \u2014 search ALL model_cost keys\n        # that contain \"glm-\"\
    \ and extract the model ID\n        \"search_keyword\": \"glm-\",\n        \"\
    filter_patterns\": [r\"^glm-[45]\"],\n        \"extract_regex\": r\"(glm-[0-9.]+(?:-flash)?)\"\
    ,\n    },\n    \"nvidia\": {\n        \"mode\": \"prefixed\",\n        \"search_keyword\"\
    : \"nemotron\",\n        \"filter_patterns\": [r\"nemotron-3\"],\n        \"extract_regex\"\
    : r\"(nemotron-3[a-z0-9.-]+)\",\n    },\n    \"qwen\": {\n        \"mode\": \"\
    prefixed\",\n        \"search_keyword\": \"qwen3\",\n        \"filter_patterns\"\
    : [r\"qwen3\"],\n        \"extract_regex\": r\"(qwen3[a-z0-9.-]+)\",\n    },\n\
    }\n\n# Parse current verified_models.py to get the existing model IDs per provider\n\
    # (Read the file and extract the arrays via ast.parse)\n# ... build current_models:\
    \ dict[str, set[str]] from verified_models.py\n\nfor provider, spec in PROVIDER_LITELLM_MAP.items():\n\
    \    litellm_models = set()\n\n    if spec[\"mode\"] == \"bare\":\n        # Match\
    \ bare names (no \"/\" prefix) in model_cost\n        for m in all_litellm_models:\n\
    \            if \"/\" not in m:\n                for pat in spec[\"patterns\"\
    ]:\n                    if re.match(pat, m, re.IGNORECASE):\n                \
    \        litellm_models.add(m.lower())\n                        break\n    elif\
    \ \"search_keyword\" in spec:\n        # For providers that appear under many\
    \ prefixes (glm, nvidia, qwen),\n        # search all model_cost keys containing\
    \ the keyword and extract the model ID\n        kw = spec[\"search_keyword\"]\n\
    \        extract_re = re.compile(spec[\"extract_regex\"], re.IGNORECASE)\n   \
    \     for m in all_litellm_models:\n            if kw in m.lower():\n        \
    \        match = extract_re.search(m)\n                if match:\n           \
    \         model_id = match.group(1).lower()\n                    # Apply filter\
    \ patterns\n                    if any(re.search(p, model_id, re.IGNORECASE) for\
    \ p in spec[\"filter_patterns\"]):\n                        litellm_models.add(model_id)\n\
    \    else:\n        for m in all_litellm_models:\n            for prefix in spec[\"\
    prefixes\"]:\n                if m.lower().startswith(prefix.lower()):\n     \
    \               model_id = m.split(\"/\", 1)[-1]\n                    if \"filter_patterns\"\
    \ not in spec or any(\n                        re.search(p, model_id, re.IGNORECASE)\
    \ for p in spec[\"filter_patterns\"]\n                    ):\n               \
    \         litellm_models.add(model_id.lower())\n                    break\n\n\
    \    current_norm = {m.lower() for m in current_models.get(provider, set())}\n\
    \    new_models = litellm_models - current_norm\n\n    if new_models:\n      \
    \  print(f\"\\n=== {provider}: NEW models in LiteLLM model_cost not in verified_models.py\
    \ ===\")\n        for m in sorted(new_models):\n            print(f\"  {m}\")\n\
    ```\n\nThis outputs candidate models that have pricing entries in LiteLLM but\
    \ are missing from `verified_models.py`.\n\n#### Tier 2 \u2014 OpenRouter availability\
    \ confirmation (PRIMARY availability check)\n\n**This step is critical for filtering\
    \ out models that are in LiteLLM but not yet publicly callable.** OpenRouter is\
    \ a model aggregator/proxy that lists models that are actually available right\
    \ now. It has a **public API** (no auth needed) and covers all providers in a\
    \ single call. OpenHands already supports OpenRouter as a provider, so if a model\
    \ is on OpenRouter, OpenHands users can call it.\n\n**Query the OpenRouter API:**\n\
    ```bash\ncurl -s \"https://openrouter.ai/api/v1/models\" | python3 -c \"\nimport\
    \ json, sys\nd = json.load(sys.stdin)\nmodels = d.get('data', [])\n# Build a set\
    \ of all OpenRouter model IDs (lowercase)\nor_ids = {m['id'].lower() for m in\
    \ models}\nprint(f'OpenRouter has {len(or_ids)} models')\n\"\n```\n\n**Matching\
    \ is critical \u2014 OpenRouter uses different naming conventions than `verified_models.py`:**\n\
    - Prefixes differ: `moonshotai/` (not `moonshot/`), `z-ai/` (not `zai-org/`),\
    \ `qwen/` (not `dashscope/`)\n- Version format differs: `claude-fable-5.1` (dots)\
    \ vs `claude-fable-5-1` (dashes in verified_models.py)\n- Some models have date\
    \ suffixes: `qwen/qwen3.8-max-0902` vs `qwen3.8-max`\n- Some have simplified names:\
    \ `nvidia/nemotron-3.5-lightning` vs `nemotron-3.5-lightning-30b-a3b`\n\nTo match\
    \ reliably, for each Tier 1 candidate model ID, search the OpenRouter model list\
    \ using **fuzzy matching**:\n1. Try exact match on the model part (after stripping\
    \ any provider prefix from the OpenRouter ID)\n2. Try replacing `-` with `.` and\
    \ vice versa in the version number (e.g., `claude-fable-5-1` \u2192 `claude-fable-5.1`)\n\
    3. Try prefix matching (e.g., `nemotron-3.5-lightning` matches `nemotron-3.5-lightning-30b-a3b`)\n\
    4. If still no match, the model is NOT available on OpenRouter\n\n**Filtering\
    \ rules:**\n- A model confirmed on OpenRouter is **definitely callable** \u2014\
    \ add it.\n- A model NOT on OpenRouter but with a provider API key available:\
    \ check the provider's direct `/v1/models` endpoint (see Tier 2b below). If confirmed\
    \ there, add it.\n- A model NOT on OpenRouter and NO provider API key available:\
    \ **skip it** and note in the summary as \"not confirmed available \u2014 skipped.\"\
    \ Do NOT add models that can't be confirmed as callable. This prevents adding\
    \ not-yet-public models like `claude-mythos-5`.\n\n#### Tier 2b \u2014 Provider\
    \ API model-list endpoints (SECONDARY availability check)\n\nFor models NOT found\
    \ on OpenRouter but where the provider's API key is available, query the provider's\
    \ direct API as a fallback. This catches models that may be available directly\
    \ from the provider but not yet on OpenRouter.\n\n| Provider | Endpoint | Auth\
    \ | Secret needed |\n|---|---|---|---|\n| OpenAI | `GET https://api.openai.com/v1/models`\
    \ | `Authorization: Bearer <key>` | `OPENAI_API_KEY` (if registered) |\n| Anthropic\
    \ | `GET https://api.anthropic.com/v1/models` | `x-api-key: <key>` + `anthropic-version:\
    \ 2023-06-01` | `ANTHROPIC_API_KEY` (if registered) |\n| DeepSeek | `GET https://api.deepseek.com/models`\
    \ | `Authorization: Bearer <key>` | `DEEPSEEK_API_KEY` (if registered) |\n| Mistral\
    \ | `GET https://api.mistral.ai/v1/models` | `Authorization: Bearer <key>` | `MISTRAL_API_KEY`\
    \ (if registered) |\n| Moonshot | `GET https://api.moonshot.cn/v1/models` | `Authorization:\
    \ Bearer <key>` | `MOONSHOT_API_KEY` (if registered) |\n| Google Gemini | `GET\
    \ https://generativelanguage.googleapis.com/v1beta/models?key=<key>` | URL param\
    \ | `GEMINI_API_KEY` (if registered) |\n| MiniMax | `GET https://api.minimaxi.com/v1/models`\
    \ | `Authorization: Bearer <key>` | `MINIMAX_API_KEY` (if registered) |\n| Zhipu\
    \ (GLM) | `GET https://api.z.ai/api/paas/v4/models` | `Authorization: Bearer <key>`\
    \ | `ZAI_API_KEY` (if registered) |\n| Nvidia | `GET https://integrate.api.nvidia.com/v1/models`\
    \ | None (public) | None \u2014 always query this |\n\nUse `get_secret(name)`\
    \ to check if a key is available. If not set, skip that provider's API check gracefully.\n\
    \n#### Tier 3 \u2014 Web confirmation (ELIMINATED for discovery)\n\n**Do NOT use\
    \ web browsing to discover new models.** Web browsing is unreliable \u2014 it\
    \ led to adding `qwen3.8-flash` which doesn't exist in LiteLLM, and `claude-mythos-5`\
    \ which the maintainer confirmed is not publicly available. LiteLLM's `model_cost`\
    \ registry combined with provider API endpoints (Tier 2) is the reliable source.\n\
    \nThe only acceptable use of web browsing is to confirm the exact model ID format\
    \ when there's a genuine ambiguity in casing or naming convention between LiteLLM\
    \ and what `verified_models.py` uses \u2014 and even then, only browse the single\
    \ relevant provider's docs page, not all of them.\n\n### Step 3 \u2014 Open or\
    \ update PRs\n\nIf you found one or more confirmed new models:\n\n1. **Check for\
    \ an existing open PR first.** Use the GitHub API to search for open PRs in `OpenHands/software-agent-sdk`\
    \ created by `all-hands-bot` with \"LLM\" or \"model\" in the title:\n   ```bash\n\
    \   curl -s -H \"Authorization: token $GITHUB_TOKEN\" \\\n     \"https://api.github.com/repos/OpenHands/software-agent-sdk/pulls?state=open&sort=created&direction=desc&per_page=20\"\
    \ \\\n     | python3 -c \"\n   import json, sys\n   prs = json.load(sys.stdin)\n\
    \   for pr in prs:\n       if pr['user']['login'] == 'all-hands-bot' and ('llm'\
    \ in pr['title'].lower() or 'model' in pr['title'].lower()):\n           print(pr['number'],\
    \ pr['title'], pr['head']['ref'])\n   \"\n   ```\n   - If an existing open PR\
    \ is found: **check out its branch** (`git fetch origin <branch> && git checkout\
    \ <branch>`), apply the new model additions on top of it, and force-push the updated\
    \ commit. Do NOT open a new PR. This keeps the review history in one place and\
    \ avoids PR sprawl.\n   - If no existing open PR is found: create a new branch\
    \ `add-new-llm-models-<YYYYMMDD>`.\n2. Update `verified_models.py`: add each new\
    \ model ID to the correct provider array AND to `VERIFIED_OPENHANDS_MODELS` if\
    \ it belongs to the curated subset (i.e., it is a flagship/reasoning model from\
    \ a provider we surface to users \u2014 follow the existing pattern in that list).\
    \ Keep arrays sorted consistently with the existing ordering (newest/highest first,\
    \ matching the current convention).\n3. If a new model is also accepted by an\
    \ ACP CLI (verify against the ACP provider's documented model list), update the\
    \ corresponding `_*_MODELS` tuple in `acp_providers.py` with an `ACPModelOption(id=...,\
    \ label=\"Human-Readable Name\")`.\n4. Commit with message: `Add newly released\
    \ LLM models to verified lists` (or `Update LLM model list with new models` if\
    \ appending to an existing PR branch).\n5. Push the branch and open a PR (if new)\
    \ using the repository's PR template (`.github/PULL_REQUEST_TEMPLATE.md`) if one\
    \ exists. Complete all AGENT template fields. The PR body must list each new model,\
    \ its provider, the official source URL confirming the model ID, and which arrays\
    \ were updated. Keep the HUMAN section untouched. If updating an existing PR,\
    \ add a comment to the PR summarizing what was added in this update.\n6. Use `git\
    \ config user.name \"openhands\"` and `git config user.email \"openhands@all-hands.dev\"\
    ` if not already set. Add `Co-authored-by: openhands <openhands@all-hands.dev>`\
    \ to the commit message.\n7. Do NOT mark the PR as ready for review unless explicitly\
    \ asked.\n\n### Step 4 \u2014 Post to Slack\n\nPost a message to Slack channel\
    \ `C06R25BT5B2` (`#proj-agent`) in the **OpenHands** Slack workspace, authenticating\
    \ with the `SLACK_BOT_TOKEN_OPENHANDS_AI` secret.\n\n- **Only post if changes\
    \ were made** (either a new PR was opened or an existing PR was updated with new\
    \ models). Do NOT post if no new models were found \u2014 silent no-op runs avoid\
    \ noise in the channel.\n\n- If a new PR was opened, post a concise message listing\
    \ the PR link and a one-line summary of the models added. Example:\n\n  ```\n\
    \  \U0001F916 LLM model list update \u2014 <date>\n\n  New models detected, PR\
    \ opened:\n  \u2022 <PR URL> \u2014 Added gpt-5.7, gpt-5.7-mini (OpenAI), claude-opus-4-9\
    \ (Anthropic)\n\n  _Generated by OpenHands AI on behalf of the user._\n  ```\n\
    \n- If an existing open PR was updated with additional models, post a concise\
    \ message referencing the existing PR and noting what was added. Example:\n\n\
    \  ```\n  \U0001F916 LLM model list update \u2014 <date>\n\n  Updated existing\
    \ PR with newly detected models:\n  \u2022 <PR URL> \u2014 Added kimi-k2.7-code\
    \ (Moonshot), gemini-3.6-flash (Google)\n\n  _Generated by OpenHands AI on behalf\
    \ of the user._\n  ```\n\n- Use `curl` to post to `https://slack.com/api/chat.postMessage`\
    \ with header `Authorization: Bearer $SLACK_BOT_TOKEN_OPENHANDS_AI` and JSON body\
    \ `{\"channel\": \"C06R25BT5B2\", \"text\": \"<message>\"}`.\n\n### Step 5 \u2014\
    \ Summary\n\nWrite a brief summary file in the workspace (`/workspace/summary.md`)\
    \ recording: providers checked, models found (if any), PR URLs, and the Slack\
    \ message posted. This is for auditability.\n\n## Guardrails\n\n- Only add models\
    \ that appear in LiteLLM's `model_cost` registry (have pricing entries). Never\
    \ add models found only via web browsing.\n- **Confirm availability via OpenRouter**\
    \ (public, no key needed) before adding any model. Only add models that are confirmed\
    \ callable on OpenRouter OR the provider's direct API. Skip models that can't\
    \ be confirmed as callable \u2014 this prevents adding not-yet-public models.\n\
    - Only add models in **series we already support**. No new providers.\n- Do not\
    \ remove or rename existing model IDs \u2014 only append.\n- If the official source\
    \ is ambiguous about the exact ID string, skip that model and note it in the summary.\n\
    - **Never open a new PR if an existing open PR from `all-hands-bot` for LLM/model\
    \ updates already exists.** Instead, check out that PR's branch, add the new models,\
    \ and force-push. One rolling PR at a time.\n- **Only post to Slack when changes\
    \ are actually made** (new PR opened or existing PR updated). No-post on no-op\
    \ runs.\n- One PR per run is preferred (batch all new models into a single PR\
    \ or the existing rolling PR).\n- Keep the Slack message concise.\n- Always include\
    \ the AI disclosure line in the Slack message.\n"
  repos:
  - ref: main
    url: https://github.com/OpenHands/software-agent-sdk
prompt: "# LLM Model List Update Automation \u2014 Prompt\n\nYou are running as an\
  \ OpenHands automation, twice a week (Wednesday and Saturday at 09:00 UTC). Your\
  \ job is to detect newly released language models in the series OpenHands already\
  \ supports, open PRs updating the supported-model lists, and post the PR links to\
  \ Slack.\n\n## Context \u2014 what lists exist and where\n\nThe canonical source\
  \ of truth for supported LLM models lives in the cloned `OpenHands/software-agent-sdk`\
  \ repository at:\n\n**`openhands-sdk/openhands/sdk/llm/utils/verified_models.py`**\n\
  \nThis file contains per-provider arrays of verified model IDs:\n\n- `VERIFIED_OPENAI_MODELS`\
  \ \u2014 OpenAI GPT series (gpt-5.x, o-series, gpt-4.x)\n- `VERIFIED_ANTHROPIC_MODELS`\
  \ \u2014 Claude series (opus, sonnet, haiku)\n- `VERIFIED_MISTRAL_MODELS` \u2014\
  \ Mistral / Devstral series\n- `VERIFIED_GEMINI_MODELS` \u2014 Google Gemini series\
  \ (gemini-3.x)\n- `VERIFIED_DEEPSEEK_MODELS` \u2014 DeepSeek series (v3/v4)\n- `VERIFIED_MOONSHOT_MODELS`\
  \ \u2014 Moonshot Kimi series (k2/k3)\n- `VERIFIED_MINIMAX_MODELS` \u2014 MiniMax\
  \ series (m2/m3)\n- `VERIFIED_GLM_MODELS` \u2014 Zhipu GLM series (glm-4/5)\n- `VERIFIED_NVIDIA_MODELS`\
  \ \u2014 Nvidia Nemotron series\n- `VERIFIED_QWEN_MODELS` \u2014 Alibaba Qwen series\
  \ (qwen3)\n- `VERIFIED_OPENHANDS_MODELS` \u2014 the cross-provider curated subset\
  \ surfaced to OpenHands users\n\nA secondary file, **`openhands-sdk/openhands/sdk/settings/acp_providers.py`**,\
  \ holds ACP provider model pickers (`_CLAUDE_MODELS`, `_CODEX_MODELS`, `_GEMINI_MODELS`,\
  \ `_PI_MODELS`, `_OPENCODE_MODELS`). These are tied to what each ACP CLI server\
  \ exposes, so only update them when a new model is both released AND accepted by\
  \ the corresponding ACP CLI. When in doubt, focus on `verified_models.py` \u2014\
  \ that is the list that gets out of date and the one this automation primarily targets.\n\
  \nThe OpenHands frontend (`OpenHands/OpenHands`) does NOT maintain its own model\
  \ list. It sources from the typescript-client, which is a generated mirror of the\
  \ SDK Python. So updating `verified_models.py` propagates everywhere.\n\n## Credentials\n\
  \n- Use the registered `GITHUB_TOKEN` secret for all GitHub API calls, git operations,\
  \ and PR creation.\n- Use the registered `SLACK_BOT_TOKEN_OPENHANDS_AI` secret to\
  \ post to Slack. This token belongs to the **OpenHands** Slack workspace (team ID\
  \ `T06P212QSEA`, domain `openhands-ai`). Do NOT use `SLACK_BOT_TOKEN` \u2014 that\
  \ token belongs to a different (All Hands AI) workspace and cannot post to the destination\
  \ below.\n- Slack destination channel: `#proj-agent`, channel ID `C06R25BT5B2`.\
  \ Post by channel ID.\n\n## Workflow\n\n### Step 1 \u2014 Read the current state\n\
  \n1. Read `openhands-sdk/openhands/sdk/llm/utils/verified_models.py` from the cloned\
  \ repo. Record every model ID currently listed, grouped by provider.\n2. Also read\
  \ `openhands-sdk/openhands/sdk/settings/acp_providers.py` to record the current\
  \ ACP model pickers.\n\n### Step 2 \u2014 Detect new model releases\n\nDetection\
  \ uses **LiteLLM's `model_cost` registry as the sole discovery source**, cross-referenced\
  \ against provider API endpoints when keys are available. **Do NOT use web browsing\
  \ for model discovery** \u2014 browsing provider docs led to adding models that\
  \ don't actually exist (e.g. `qwen3.8-flash`) or aren't publicly available yet (e.g.\
  \ `claude-mythos-5`). LiteLLM's `model_cost` tracks models that have pricing entries,\
  \ which is a much more reliable signal that a model is a real, callable product.\n\
  \n**Critical distinction: `model_cost` vs `model_list`.** Use `litellm.model_cost`\
  \ ONLY, not `litellm.model_list`. `model_cost` contains models with pricing data\
  \ (indicating they're real products). `model_list` is broader and includes speculative/preview\
  \ entries. The SDK's own `unverified_models.py` uses both, but for this automation's\
  \ purpose \u2014 adding models that users can actually call \u2014 `model_cost`\
  \ is the right filter.\n\n**Even `model_cost` can include not-yet-public models**\
  \ (LiteLLM sometimes adds pricing based on announcements before models are callable).\
  \ To handle this, cross-reference against the provider's `/v1/models` API endpoint\
  \ when an API key is available. A model that appears in BOTH `model_cost` AND the\
  \ provider's API model list is confirmed publicly available.\n\n#### Tier 1 \u2014\
  \ LiteLLM `model_cost` registry (PRIMARY discovery source)\n\nThe SDK already depends\
  \ on LiteLLM (`litellm>=1.93.0`). LiteLLM's `model_cost` dictionary tracks models\
  \ that have pricing entries \u2014 meaning they're real, trackable products. This\
  \ is the most reliable programmatic source for detecting models we don't yet have\
  \ in `verified_models.py`.\n\n**Important \u2014 upgrade LiteLLM first.** Run `pip\
  \ install --upgrade litellm` to get the latest model registry before running detection.\
  \ The SDK's `pyproject.toml` pins `litellm>=1.93.0` which may lag behind.\n\nRun\
  \ this detection script:\n\n```python\nimport litellm, re, json\n\n# Use model_cost\
  \ ONLY (models with pricing = real products), NOT model_list\nall_litellm_models\
  \ = set(litellm.model_cost.keys())\n\n# Our verified_models.py providers and how\
  \ they map to LiteLLM model IDs.\n# The \"bare\" providers (openai, anthropic) use\
  \ unprefixed model IDs in\n# verified_models.py. The \"prefixed\" providers use\
  \ LiteLLM's \"provider/model\"\n# form, and verified_models.py stores the model\
  \ part without the prefix.\n# Matching is CASE-INSENSITIVE because LiteLLM uses\
  \ varied casing\n# (e.g. \"GLM-5.3\" vs \"glm-5.3\", \"Nemotron-3-Ultra\" vs \"\
  nemotron-3-ultra\").\nPROVIDER_LITELLM_MAP = {\n    \"openai\": {\n        \"mode\"\
  : \"bare\",\n        \"patterns\": [r\"^gpt-5\", r\"^gpt-4\", r\"^o[134]-\", r\"\
  ^o[134]$\", r\"^codex-\"],\n    },\n    \"anthropic\": {\n        \"mode\": \"bare\"\
  ,\n        \"patterns\": [r\"^claude-\"],\n    },\n    \"gemini\": {\n        \"\
  mode\": \"prefixed\",\n        \"prefixes\": [\"gemini/\"],\n        \"filter_patterns\"\
  : [r\"gemini-3\"],\n    },\n    \"deepseek\": {\n        \"mode\": \"prefixed\"\
  ,\n        \"prefixes\": [\"deepseek/\"],\n        \"filter_patterns\": [r\"deepseek-chat\"\
  , r\"deepseek-v[34]\", r\"deepseek-reasoner\"],\n    },\n    \"mistral\": {\n  \
  \      \"mode\": \"prefixed\",\n        \"prefixes\": [\"mistral/\"],\n        \"\
  filter_patterns\": [r\"devstral\"],\n    },\n    \"moonshot\": {\n        \"mode\"\
  : \"prefixed\",\n        \"prefixes\": [\"moonshot/\"],\n        \"filter_patterns\"\
  : [r\"kimi-k\"],\n    },\n    \"minimax\": {\n        \"mode\": \"prefixed\",\n\
  \        \"prefixes\": [\"minimax/\"],\n        \"filter_patterns\": [r\"minimax-m\"\
  , r\"MiniMax-M\"],\n    },\n    \"glm\": {\n        \"mode\": \"prefixed\",\n  \
  \      # GLM appears under many provider prefixes \u2014 search ALL model_cost keys\n\
  \        # that contain \"glm-\" and extract the model ID\n        \"search_keyword\"\
  : \"glm-\",\n        \"filter_patterns\": [r\"^glm-[45]\"],\n        \"extract_regex\"\
  : r\"(glm-[0-9.]+(?:-flash)?)\",\n    },\n    \"nvidia\": {\n        \"mode\": \"\
  prefixed\",\n        \"search_keyword\": \"nemotron\",\n        \"filter_patterns\"\
  : [r\"nemotron-3\"],\n        \"extract_regex\": r\"(nemotron-3[a-z0-9.-]+)\",\n\
  \    },\n    \"qwen\": {\n        \"mode\": \"prefixed\",\n        \"search_keyword\"\
  : \"qwen3\",\n        \"filter_patterns\": [r\"qwen3\"],\n        \"extract_regex\"\
  : r\"(qwen3[a-z0-9.-]+)\",\n    },\n}\n\n# Parse current verified_models.py to get\
  \ the existing model IDs per provider\n# (Read the file and extract the arrays via\
  \ ast.parse)\n# ... build current_models: dict[str, set[str]] from verified_models.py\n\
  \nfor provider, spec in PROVIDER_LITELLM_MAP.items():\n    litellm_models = set()\n\
  \n    if spec[\"mode\"] == \"bare\":\n        # Match bare names (no \"/\" prefix)\
  \ in model_cost\n        for m in all_litellm_models:\n            if \"/\" not\
  \ in m:\n                for pat in spec[\"patterns\"]:\n                    if\
  \ re.match(pat, m, re.IGNORECASE):\n                        litellm_models.add(m.lower())\n\
  \                        break\n    elif \"search_keyword\" in spec:\n        #\
  \ For providers that appear under many prefixes (glm, nvidia, qwen),\n        #\
  \ search all model_cost keys containing the keyword and extract the model ID\n \
  \       kw = spec[\"search_keyword\"]\n        extract_re = re.compile(spec[\"extract_regex\"\
  ], re.IGNORECASE)\n        for m in all_litellm_models:\n            if kw in m.lower():\n\
  \                match = extract_re.search(m)\n                if match:\n     \
  \               model_id = match.group(1).lower()\n                    # Apply filter\
  \ patterns\n                    if any(re.search(p, model_id, re.IGNORECASE) for\
  \ p in spec[\"filter_patterns\"]):\n                        litellm_models.add(model_id)\n\
  \    else:\n        for m in all_litellm_models:\n            for prefix in spec[\"\
  prefixes\"]:\n                if m.lower().startswith(prefix.lower()):\n       \
  \             model_id = m.split(\"/\", 1)[-1]\n                    if \"filter_patterns\"\
  \ not in spec or any(\n                        re.search(p, model_id, re.IGNORECASE)\
  \ for p in spec[\"filter_patterns\"]\n                    ):\n                 \
  \       litellm_models.add(model_id.lower())\n                    break\n\n    current_norm\
  \ = {m.lower() for m in current_models.get(provider, set())}\n    new_models = litellm_models\
  \ - current_norm\n\n    if new_models:\n        print(f\"\\n=== {provider}: NEW\
  \ models in LiteLLM model_cost not in verified_models.py ===\")\n        for m in\
  \ sorted(new_models):\n            print(f\"  {m}\")\n```\n\nThis outputs candidate\
  \ models that have pricing entries in LiteLLM but are missing from `verified_models.py`.\n\
  \n#### Tier 2 \u2014 OpenRouter availability confirmation (PRIMARY availability\
  \ check)\n\n**This step is critical for filtering out models that are in LiteLLM\
  \ but not yet publicly callable.** OpenRouter is a model aggregator/proxy that lists\
  \ models that are actually available right now. It has a **public API** (no auth\
  \ needed) and covers all providers in a single call. OpenHands already supports\
  \ OpenRouter as a provider, so if a model is on OpenRouter, OpenHands users can\
  \ call it.\n\n**Query the OpenRouter API:**\n```bash\ncurl -s \"https://openrouter.ai/api/v1/models\"\
  \ | python3 -c \"\nimport json, sys\nd = json.load(sys.stdin)\nmodels = d.get('data',\
  \ [])\n# Build a set of all OpenRouter model IDs (lowercase)\nor_ids = {m['id'].lower()\
  \ for m in models}\nprint(f'OpenRouter has {len(or_ids)} models')\n\"\n```\n\n**Matching\
  \ is critical \u2014 OpenRouter uses different naming conventions than `verified_models.py`:**\n\
  - Prefixes differ: `moonshotai/` (not `moonshot/`), `z-ai/` (not `zai-org/`), `qwen/`\
  \ (not `dashscope/`)\n- Version format differs: `claude-fable-5.1` (dots) vs `claude-fable-5-1`\
  \ (dashes in verified_models.py)\n- Some models have date suffixes: `qwen/qwen3.8-max-0902`\
  \ vs `qwen3.8-max`\n- Some have simplified names: `nvidia/nemotron-3.5-lightning`\
  \ vs `nemotron-3.5-lightning-30b-a3b`\n\nTo match reliably, for each Tier 1 candidate\
  \ model ID, search the OpenRouter model list using **fuzzy matching**:\n1. Try exact\
  \ match on the model part (after stripping any provider prefix from the OpenRouter\
  \ ID)\n2. Try replacing `-` with `.` and vice versa in the version number (e.g.,\
  \ `claude-fable-5-1` \u2192 `claude-fable-5.1`)\n3. Try prefix matching (e.g., `nemotron-3.5-lightning`\
  \ matches `nemotron-3.5-lightning-30b-a3b`)\n4. If still no match, the model is\
  \ NOT available on OpenRouter\n\n**Filtering rules:**\n- A model confirmed on OpenRouter\
  \ is **definitely callable** \u2014 add it.\n- A model NOT on OpenRouter but with\
  \ a provider API key available: check the provider's direct `/v1/models` endpoint\
  \ (see Tier 2b below). If confirmed there, add it.\n- A model NOT on OpenRouter\
  \ and NO provider API key available: **skip it** and note in the summary as \"not\
  \ confirmed available \u2014 skipped.\" Do NOT add models that can't be confirmed\
  \ as callable. This prevents adding not-yet-public models like `claude-mythos-5`.\n\
  \n#### Tier 2b \u2014 Provider API model-list endpoints (SECONDARY availability\
  \ check)\n\nFor models NOT found on OpenRouter but where the provider's API key\
  \ is available, query the provider's direct API as a fallback. This catches models\
  \ that may be available directly from the provider but not yet on OpenRouter.\n\n\
  | Provider | Endpoint | Auth | Secret needed |\n|---|---|---|---|\n| OpenAI | `GET\
  \ https://api.openai.com/v1/models` | `Authorization: Bearer <key>` | `OPENAI_API_KEY`\
  \ (if registered) |\n| Anthropic | `GET https://api.anthropic.com/v1/models` | `x-api-key:\
  \ <key>` + `anthropic-version: 2023-06-01` | `ANTHROPIC_API_KEY` (if registered)\
  \ |\n| DeepSeek | `GET https://api.deepseek.com/models` | `Authorization: Bearer\
  \ <key>` | `DEEPSEEK_API_KEY` (if registered) |\n| Mistral | `GET https://api.mistral.ai/v1/models`\
  \ | `Authorization: Bearer <key>` | `MISTRAL_API_KEY` (if registered) |\n| Moonshot\
  \ | `GET https://api.moonshot.cn/v1/models` | `Authorization: Bearer <key>` | `MOONSHOT_API_KEY`\
  \ (if registered) |\n| Google Gemini | `GET https://generativelanguage.googleapis.com/v1beta/models?key=<key>`\
  \ | URL param | `GEMINI_API_KEY` (if registered) |\n| MiniMax | `GET https://api.minimaxi.com/v1/models`\
  \ | `Authorization: Bearer <key>` | `MINIMAX_API_KEY` (if registered) |\n| Zhipu\
  \ (GLM) | `GET https://api.z.ai/api/paas/v4/models` | `Authorization: Bearer <key>`\
  \ | `ZAI_API_KEY` (if registered) |\n| Nvidia | `GET https://integrate.api.nvidia.com/v1/models`\
  \ | None (public) | None \u2014 always query this |\n\nUse `get_secret(name)` to\
  \ check if a key is available. If not set, skip that provider's API check gracefully.\n\
  \n#### Tier 3 \u2014 Web confirmation (ELIMINATED for discovery)\n\n**Do NOT use\
  \ web browsing to discover new models.** Web browsing is unreliable \u2014 it led\
  \ to adding `qwen3.8-flash` which doesn't exist in LiteLLM, and `claude-mythos-5`\
  \ which the maintainer confirmed is not publicly available. LiteLLM's `model_cost`\
  \ registry combined with provider API endpoints (Tier 2) is the reliable source.\n\
  \nThe only acceptable use of web browsing is to confirm the exact model ID format\
  \ when there's a genuine ambiguity in casing or naming convention between LiteLLM\
  \ and what `verified_models.py` uses \u2014 and even then, only browse the single\
  \ relevant provider's docs page, not all of them.\n\n### Step 3 \u2014 Open or update\
  \ PRs\n\nIf you found one or more confirmed new models:\n\n1. **Check for an existing\
  \ open PR first.** Use the GitHub API to search for open PRs in `OpenHands/software-agent-sdk`\
  \ created by `all-hands-bot` with \"LLM\" or \"model\" in the title:\n   ```bash\n\
  \   curl -s -H \"Authorization: token $GITHUB_TOKEN\" \\\n     \"https://api.github.com/repos/OpenHands/software-agent-sdk/pulls?state=open&sort=created&direction=desc&per_page=20\"\
  \ \\\n     | python3 -c \"\n   import json, sys\n   prs = json.load(sys.stdin)\n\
  \   for pr in prs:\n       if pr['user']['login'] == 'all-hands-bot' and ('llm'\
  \ in pr['title'].lower() or 'model' in pr['title'].lower()):\n           print(pr['number'],\
  \ pr['title'], pr['head']['ref'])\n   \"\n   ```\n   - If an existing open PR is\
  \ found: **check out its branch** (`git fetch origin <branch> && git checkout <branch>`),\
  \ apply the new model additions on top of it, and force-push the updated commit.\
  \ Do NOT open a new PR. This keeps the review history in one place and avoids PR\
  \ sprawl.\n   - If no existing open PR is found: create a new branch `add-new-llm-models-<YYYYMMDD>`.\n\
  2. Update `verified_models.py`: add each new model ID to the correct provider array\
  \ AND to `VERIFIED_OPENHANDS_MODELS` if it belongs to the curated subset (i.e.,\
  \ it is a flagship/reasoning model from a provider we surface to users \u2014 follow\
  \ the existing pattern in that list). Keep arrays sorted consistently with the existing\
  \ ordering (newest/highest first, matching the current convention).\n3. If a new\
  \ model is also accepted by an ACP CLI (verify against the ACP provider's documented\
  \ model list), update the corresponding `_*_MODELS` tuple in `acp_providers.py`\
  \ with an `ACPModelOption(id=..., label=\"Human-Readable Name\")`.\n4. Commit with\
  \ message: `Add newly released LLM models to verified lists` (or `Update LLM model\
  \ list with new models` if appending to an existing PR branch).\n5. Push the branch\
  \ and open a PR (if new) using the repository's PR template (`.github/PULL_REQUEST_TEMPLATE.md`)\
  \ if one exists. Complete all AGENT template fields. The PR body must list each\
  \ new model, its provider, the official source URL confirming the model ID, and\
  \ which arrays were updated. Keep the HUMAN section untouched. If updating an existing\
  \ PR, add a comment to the PR summarizing what was added in this update.\n6. Use\
  \ `git config user.name \"openhands\"` and `git config user.email \"openhands@all-hands.dev\"\
  ` if not already set. Add `Co-authored-by: openhands <openhands@all-hands.dev>`\
  \ to the commit message.\n7. Do NOT mark the PR as ready for review unless explicitly\
  \ asked.\n\n### Step 4 \u2014 Post to Slack\n\nPost a message to Slack channel `C06R25BT5B2`\
  \ (`#proj-agent`) in the **OpenHands** Slack workspace, authenticating with the\
  \ `SLACK_BOT_TOKEN_OPENHANDS_AI` secret.\n\n- **Only post if changes were made**\
  \ (either a new PR was opened or an existing PR was updated with new models). Do\
  \ NOT post if no new models were found \u2014 silent no-op runs avoid noise in the\
  \ channel.\n\n- If a new PR was opened, post a concise message listing the PR link\
  \ and a one-line summary of the models added. Example:\n\n  ```\n  \U0001F916 LLM\
  \ model list update \u2014 <date>\n\n  New models detected, PR opened:\n  \u2022\
  \ <PR URL> \u2014 Added gpt-5.7, gpt-5.7-mini (OpenAI), claude-opus-4-9 (Anthropic)\n\
  \n  _Generated by OpenHands AI on behalf of the user._\n  ```\n\n- If an existing\
  \ open PR was updated with additional models, post a concise message referencing\
  \ the existing PR and noting what was added. Example:\n\n  ```\n  \U0001F916 LLM\
  \ model list update \u2014 <date>\n\n  Updated existing PR with newly detected models:\n\
  \  \u2022 <PR URL> \u2014 Added kimi-k2.7-code (Moonshot), gemini-3.6-flash (Google)\n\
  \n  _Generated by OpenHands AI on behalf of the user._\n  ```\n\n- Use `curl` to\
  \ post to `https://slack.com/api/chat.postMessage` with header `Authorization: Bearer\
  \ $SLACK_BOT_TOKEN_OPENHANDS_AI` and JSON body `{\"channel\": \"C06R25BT5B2\", \"\
  text\": \"<message>\"}`.\n\n### Step 5 \u2014 Summary\n\nWrite a brief summary file\
  \ in the workspace (`/workspace/summary.md`) recording: providers checked, models\
  \ found (if any), PR URLs, and the Slack message posted. This is for auditability.\n\
  \n## Guardrails\n\n- Only add models that appear in LiteLLM's `model_cost` registry\
  \ (have pricing entries). Never add models found only via web browsing.\n- **Confirm\
  \ availability via OpenRouter** (public, no key needed) before adding any model.\
  \ Only add models that are confirmed callable on OpenRouter OR the provider's direct\
  \ API. Skip models that can't be confirmed as callable \u2014 this prevents adding\
  \ not-yet-public models.\n- Only add models in **series we already support**. No\
  \ new providers.\n- Do not remove or rename existing model IDs \u2014 only append.\n\
  - If the official source is ambiguous about the exact ID string, skip that model\
  \ and note it in the summary.\n- **Never open a new PR if an existing open PR from\
  \ `all-hands-bot` for LLM/model updates already exists.** Instead, check out that\
  \ PR's branch, add the new models, and force-push. One rolling PR at a time.\n-\
  \ **Only post to Slack when changes are actually made** (new PR opened or existing\
  \ PR updated). No-post on no-op runs.\n- One PR per run is preferred (batch all\
  \ new models into a single PR or the existing rolling PR).\n- Keep the Slack message\
  \ concise.\n- Always include the AI disclosure line in the Slack message.\n"
