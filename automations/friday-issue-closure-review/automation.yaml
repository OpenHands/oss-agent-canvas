enabled: true
entrypoint: .venv/bin/python main.py
keep_alive: null
model: null
name: Friday issue closure review
preset_metadata: null
prompt: 'Review every open GitHub issue (exclude pull requests) in OpenHands/OpenHands
  and OpenHands/software-agent-sdk. Identify only issues you are highly confident
  can possibly be closed for exactly one of these reasons: completed, duplicate, or
  outdated. Be deliberately conservative: if evidence is incomplete, ambiguous, subjective,
  or requires maintainer judgment, take no action. A completed recommendation requires
  clear evidence that merged code or an already-shipped change fully resolves the
  issue. A duplicate recommendation requires a clearly equivalent canonical issue
  and must link it. An outdated recommendation requires clear evidence that the reported
  behavior, API, or requirement no longer applies to the current project. Inspect
  issue bodies, comments, linked issues and pull requests, current repository state,
  releases, and other relevant evidence before deciding. Do not recommend closure
  merely because an issue is old, inactive, cannot be reproduced quickly, or has a
  stale label. Never close an issue and never change labels, milestones, or assignees.
  Before commenting, inspect all existing comments and skip the issue if an OpenHands
  Friday closure review already made the same recommendation or if an equivalent closure
  proposal is already present. For each qualifying issue, post exactly one short GitHub
  comment stating the proposed reason, the decisive evidence with links, and that
  maintainers should verify before closing. End every GitHub comment with: "This comment
  was generated by an AI agent (OpenHands) on behalf of the user." Also include the
  hidden marker <!-- openhands-friday-closure-review --> for duplicate prevention.
  After reviewing both repositories, post one concise message to Slack channel C0BGK8NRYUX.
  Include only the issues you commented on, grouped by completed, duplicate, and outdated;
  each bullet must contain the repository/issue number as a link and a one-line reason.
  If none qualify, post only: "Friday issue review: no high-confidence closure candidates."
  End the Slack message with: "Sent by OpenHands on behalf of the user." Keep all
  writing minimal and clear. Use the stored GITHUB_TOKEN and SLACK_BOT_TOKEN only
  with their respective official APIs.'
setup_script_path: setup.sh
tarball_executables:
- setup.sh
tarball_source:
  type: internal
  url: null
timeout: 1800
trigger:
  schedule: 0 12 * * 5
  timezone: UTC
  type: cron
