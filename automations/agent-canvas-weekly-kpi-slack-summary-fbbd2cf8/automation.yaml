enabled: true
entrypoint: .venv/bin/python main.py
keep_alive: null
model: null
name: Agent Canvas weekly KPI Slack summary
preset_metadata:
  preset_type: prompt
  prompt: "# Agent Canvas weekly KPI Slack summary automation prompt\n\nYou are running\
    \ as an OpenHands automation every Monday at 9:00 AM ET (America/New_York). Create\
    \ a concise weekly PostHog KPI summary for the Agent Canvas project and post it\
    \ to Slack.\n\n## Data sources and credentials\n\n- Use the registered `POSTHOG_API_KEY`\
    \ secret to authenticate to PostHog.\n- PostHog host: `https://us.posthog.com`.\n\
    - PostHog project: `Agent Canvas`, project ID `414029`.\n- Slack workspace / group:\
    \ **All Hands AI** (`allhandsai.slack.com`, Slack team ID `T07E1S2M2Q6`).\n- Use\
    \ the registered `SLACK_BOT_TOKEN` secret to authenticate to the **All Hands AI**\
    \ Slack workspace. This token belongs to the All Hands AI workspace. Do NOT use\
    \ `SLACK_BOT_TOKEN_OPENHANDS_AI` \u2014 that token belongs to a different (OpenHands)\
    \ workspace and cannot post to the destination below.\n- Slack destination channel:\
    \ `#logistics-oss-team`, channel ID `C0BGK8NRYUX`. Post by channel ID `C0BGK8NRYUX`\
    \ (and reference the channel name `#logistics-oss-team` in the message body when\
    \ useful).\n\n## PostHog dashboards and insights to examine\n\n1. Primary KPI\
    \ scorecard dashboard: `OSS Team \u2014 KPI Scorecard`, dashboard ID `1859001`.\n\
    \   - `Users with a succeeded automation`, insight ID `10455077`, short ID `KVSzpTcC`.\n\
    \   - `Identifiable backend connections`, insight ID `10455078`, short ID `EtuDDvTs`.\n\
    \   - `Total conversations (external)`, insight ID `10175033`, short ID `i2ZnKXvo`.\n\
    2. Automation diagnostics dashboard: `OSS Team \u2014 Activation + Automations`,\
    \ dashboard ID `1725195`.\n3. Automation funnel scratchpad dashboard: `Scratchpad\
    \ \u2014 Automations funnel analysis`, dashboard ID `1946265`.\n   - `Automations\
    \ reach among active users`, insight ID `10701783`, short ID `XFK7lBH1`.\n   -\
    \ `Canvas landing to Automations timing`, insight ID `10701793`, short ID `GW19SAhm`.\n\
    \n## Required analysis\n\n- Compare the last two complete 7-day windows, not partial\
    \ current-day data.\n  - Current week window: the most recent complete 7 days\
    \ ending before the run time.\n  - Previous week window: the 7 days immediately\
    \ before that.\n\n### KPI section (primary scorecard only)\n- For each KPI graph\
    \ on the primary scorecard, calculate:\n  - previous-week value\n  - current-week\
    \ value\n  - absolute delta\n  - percentage delta where the previous value is\
    \ non-zero\n- Do **not** include \"automations page visitors\" or any page-view\
    \ metric in the KPI section \u2014 page-view metrics belong only in the Automation\
    \ funnel section below.\n\n### Automation funnel section\n- Build the funnel from\
    \ the scratchpad/diagnostics dashboards and report each stage's value (and week-over-week\
    \ delta) for both windows:\n  - **Page views** (visitors who reached/landed on\
    \ the Automations / Canvas page)\n  - **Created automation** (users who created\
    \ an automation)\n  - **Automation ran** (automations that executed)\n  - **Successful\
    \ runs** (automations that ran to a successful/succeeded state)\n- If a funnel\
    \ stage cannot be derived from a saved insight, run an equivalent HogQL/query\
    \ API request for that stage.\n- Summarize how the funnel shifted between the\
    \ two weeks (e.g., which stage moved most, conversion-rate changes between stages).\n\
    \n- Use PostHog API endpoints directly where possible. If saved insight result\
    \ endpoints are unavailable or stale, fetch the insight definitions and run equivalent\
    \ HogQL/query API requests.\n- Do not include raw personal data, emails, distinct\
    \ IDs, or individual user identifiers. Aggregate metrics only.\n- If a metric\
    \ cannot be fetched, include `n/a` for that metric and a very brief reason.\n\n\
    ## Slack output requirements\n\n- Be **very concise**: keep the whole message\
    \ tight \u2014 a few bullets per section, roughly 120 words total max. No verbosity,\
    \ no preamble.\n- Structure the message with exactly two clearly labeled sections\
    \ using these headers on their own line:\n  - `*KPI*` followed by the scorecard\
    \ bullets\n  - `*Automation funnel*` followed by the funnel bullets\n- Include\
    \ the comparison date ranges once near the title.\n- Include a short title line\
    \ like `Agent Canvas weekly KPIs`.\n- Highlight only material changes; add a single\
    \ one-sentence takeaway at the end.\n- Use plain text or simple Slack markdown;\
    \ no tables.\n- End with this disclosure line: `_Generated by OpenHands AI on\
    \ behalf of the user._`\n- Post the final summary to Slack channel `C0BGK8NRYUX`\
    \ (`#logistics-oss-team`) in the **All Hands AI** Slack workspace (`allhandsai.slack.com`,\
    \ team ID `T07E1S2M2Q6`), authenticating with the registered `SLACK_BOT_TOKEN`\
    \ secret.\n"
