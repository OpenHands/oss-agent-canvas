name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Discover and run repository and automation tests
        env:
          SLACK_BOT_TOKEN_OPENHANDS_AI: ci-test-placeholder
        run: |
          mapfile -t directories < <(find tests automations plugins -type f -name 'test_*.py' -printf '%h\n' | sort -u)
          if (( ${#directories[@]} == 0 )); then
            echo 'No unit tests found'
            exit 1
          fi
          failed=0
          for directory in "${directories[@]}"; do
            echo "Running tests in ${directory}"
            python -m unittest discover -s "$directory" -p 'test_*.py' -v || failed=1
          done
          exit "$failed"
